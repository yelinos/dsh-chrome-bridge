name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, check the README's "Known limitations"
        section — the idea may already be tracked.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the plugin does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent tools
        - Chrome extension
        - Sidebar panel
        - Domain approval / security
        - Documentation
        - Other
    validations:
      required: true
