<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DSH Chrome Bridge">
  <!-- Rounded app tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f5bb5"/>
  <!-- Browser window -->
  <rect x="9" y="13" width="46" height="33" rx="5" fill="#ffffff"/>
  <path d="M9 18 a5 5 0 0 1 5-5 h36 a5 5 0 0 1 5 5 v4 H9 z" fill="#7db4ea"/>
  <circle cx="15" cy="17.5" r="1.7" fill="#0f5bb5"/>
  <circle cx="20.5" cy="17.5" r="1.7" fill="#0f5bb5"/>
  <!-- Page content lines -->
  <rect x="14" y="27" width="22" height="2.6" rx="1.3" fill="#b9d3ef"/>
  <rect x="14" y="32.5" width="34" height="2.6" rx="1.3" fill="#b9d3ef"/>
  <rect x="14" y="38" width="27" height="2.6" rx="1.3" fill="#b9d3ef"/>
  <!-- Connection arc: harness node (left) bridging to the browser (right) -->
  <path d="M16 55 C 22 46, 42 46, 48 55" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="16" cy="55" r="3.4" fill="#ffd166"/>
  <circle cx="48" cy="55" r="3.4" fill="#ffd166"/>
</svg>
